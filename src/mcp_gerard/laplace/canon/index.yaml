# ---------------------------------------------------------------------------
# Skills. activity = which operational bucket the skill serves.
#   generating - raw generative acts that produce material: derive algebra, distil
#                prior work, seed an idea, hold focus
#   staging    - fill a trunk-root ledger (results, literature, numerics, identity)
#                and draft the manuscript core-outward; the generation stage lives here
#   evaluating - structural linting, cross-referencing, auditing claims against evidence
# status = experimental | core | deprecated  (mutated by the dreamer on evidence)
# backing = optional deterministic script, runnable via laplace_run / laplace_verify
# ---------------------------------------------------------------------------
