# The Laplace Canon manifest.
#
# This is the machine-readable overlay the engine uses for relevance selection
# (laplace_orient) and lifecycle/fitness tracking (laplace_assess / laplace_dream).
#
# The loader DISCOVERS files on disk (wiki/**.md, skills/*/SKILL.md); this file
# only supplies overlay metadata keyed by ref/name. Missing entries fall back to
# sensible defaults (status inferred from an [EXPERIMENTAL] tag, phase=execute,
# domain=global, tags derived from the path). The dreamer writes status + fitness
# back into this file, so it is the single mutable record of canon health.
version: 1

# ---------------------------------------------------------------------------
# Wiki nodes. `scope: global` nodes are always offered by orient; `scope: domain`
# nodes are offered only when their domain matches the active goal.
# ---------------------------------------------------------------------------
wiki:
  aesthetics/voice_and_style:
    title: The Laplace Voice
    scope: global
    tags: [style, writing, voice, prose, tone]
  aesthetics/tikz_guidelines:
    title: TikZ Guidelines
    scope: global
    tags: [figures, tikz, plots, visual]
  aesthetics/typography_and_layout:
    title: Typography and Layout
    scope: global
    tags: [layout, columns, typography, visual]
  aesthetics/visual_mechanics:
    title: Visual Mechanics
    scope: global
    tags: [figures, visual, schematic]
  structure/pedagogical_segregation:
    title: Pedagogical Segregation
    scope: global
    tags: [structure, appendix, narrative, derivation]
  workflow/iterative_review_schema:
    title: Iterative Review Schema
    scope: global
    tags: [workflow, review, swarm, critical-regime]
  workflow/core_outward_trunk:
    title: Core-Outward Trunk
    scope: global
    tags: [workflow, drafting, trunk, core-outward, firewall, ledger, propagation, stages]
  operations/compilation_and_release:
    title: Compilation & Release
    scope: global
    tags: [ops, compile, release, ci]
  operations/git_mechanics:
    title: Git Mechanics
    scope: global
    tags: [ops, git, revert, windows]
  operations/shell_mechanics:
    title: Shell Mechanics
    scope: global
    tags: [ops, shell, powershell, python, anti-laziness]
  templates/project_scaffold:
    title: Project Scaffold
    scope: global
    tags: [meta, scaffold, new-domain]
  author/the_author:
    title: The Author
    scope: global
    tags: [author, persona, working-style, method, collaboration]

# ---------------------------------------------------------------------------
# Domains. Theory axioms + active project state, loaded by orient when relevant.
# ---------------------------------------------------------------------------
domains:
  synthetics:
    axioms: domains/synthetics/axioms
    tags: [synthetics, hierarchy]
    projects:
      adaptive_normal_form: domains/synthetics/projects/adaptive_normal_form
      the_phases_of_hierarchy: domains/synthetics/projects/the_phases_of_hierarchy

# ---------------------------------------------------------------------------
# Skills. activity = which operational bucket the skill serves.
#   generating - doing mathematics to add to evidence, literature search
#   staging    - manuscript drafting, workflow routing, and figure creation
#   evaluating - structural linting, cross-referencing, verifying claims
# status = experimental | core | deprecated  (mutated by the dreamer on evidence)
# backing = optional deterministic script, runnable via laplace_run / laplace_verify
# ---------------------------------------------------------------------------
