models:
  llama3-70b-8192:
    description: "Llama 3 70B model with an 8K context window, offering strong reasoning capabilities."
    capabilities: "🎯 Best for: Complex reasoning, code generation, nuanced text understanding."
    tags: ["llama3", "reasoning", "powerful"]
    context_window: "8,192 tokens"
    output_tokens: 8192
    param: "max_tokens"
    supports_temperature: true
    supports_vision: false
    supports_tool_calling: true
    supports_system_prompt: true
    input_per_1m: 0.59
    output_per_1m: 0.79

  llama3-8b-8192:
    description: "Llama 3 8B model with an 8K context window, optimized for speed and efficiency."
    capabilities: "⚡ Best for: General chat, summarization, fast response tasks."
