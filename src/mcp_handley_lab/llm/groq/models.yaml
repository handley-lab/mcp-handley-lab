    output_per_1m: 0.60

  openai/gpt-oss-20b:
    description: "OpenAI's open-weight GPT-OSS 20B model delivering excellent speed-to-quality balance."
    capabilities: "⚖️ Best for: Balanced performance, general-purpose tasks, cost-effective high-quality output."
