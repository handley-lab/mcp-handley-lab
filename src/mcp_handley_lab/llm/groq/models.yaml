    context_window: "8,192 tokens"
    output_tokens: 8192
    param: "max_tokens"
    supports_temperature: true
    supports_vision: false
    supports_tool_calling: true
    supports_system_prompt: true
    input_per_1m: 0.05
    output_per_1m: 0.08

  mixtral-8x7b-32768:
    description: "Mixtral 8x7B Mixture-of-Experts model with a 32K context window."
    capabilities: "⚖️ Best for: Long-context tasks, multilingual applications, balanced performance."
    tags: ["mixtral", "long-context"]
    context_window: "32,768 tokens"
    output_tokens: 32768
    param: "max_tokens"
    supports_temperature: true
    supports_vision: false
    supports_tool_calling: true
    supports_system_prompt: true
    input_per_1m: 0.24
    output_per_1m: 0.24

  gemma-7b-it:
    description: "Google's Gemma 7B instruction-tuned model, offering a balance of performance and efficiency."
    capabilities: "📚 Best for: General-purpose tasks, instruction following, creative text."
    tags: ["gemma", "general"]
    context_window: "8,192 tokens"
    output_tokens: 8192
    param: "max_tokens"
    supports_temperature: true
    supports_vision: false
    supports_tool_calling: true
    supports_system_prompt: true
    input_per_1m: 0.07
    output_per_1m: 0.07

  moonshotai/kimi-k2-instruct-0905:
    description: "Moonshot AI's Kimi (via Groq) – 256K context, strong bilingual reasoning and production-grade code generation."
    capabilities: "🎯 Best for: Long-context coding, cross-language debugging, deep reasoning, document-to-code workflows."
    tags: ["kimi", "long-context", "reasoning", "powerful"]
    context_window: "262,144 tokens"
    output_tokens: 16384
    param: "max_tokens"
    supports_temperature: true
    supports_vision: false
    supports_tool_calling: true
    supports_system_prompt: true
    input_per_1m: 1.00
    output_per_1m: 3.00

display_categories:
  - name: "🌙 Moonshot Kimi Models"
    tags: ["kimi"]
    description: "Moonshot AI's long-context reasoning models."
  - name: "🚀 Llama 3 Models"
    tags: ["llama3"]
    description: "Meta's latest generation of open-source models."
  - name: "⚖️ Mixtral MoE Models"
    tags: ["mixtral"]
    description: "Mixture-of-Experts models from Mistral AI."
  - name: "📚 Google Gemma Models"
    tags: ["gemma"]
    description: "Google's family of open models."

default_model: "llama3-8b-8192"

usage_notes:
  - "Groq models are served via an OpenAI-compatible API."
  - "All models support the 'temperature' parameter."
  - "Pricing is per million tokens (input/output)."
  - "No current support for vision or image generation via this integration."
