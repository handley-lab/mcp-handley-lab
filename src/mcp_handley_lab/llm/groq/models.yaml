display_categories:
  - name: "🌙 Moonshot Kimi Models"
    tags: ["kimi"]
    description: "Moonshot AI's long-context reasoning models."
  - name: "🦙 Meta Llama Models"
    tags: ["llama"]
    description: "Meta's latest Llama 3.x generation models."
  - name: "🤖 OpenAI GPT-OSS Models"
    tags: ["gpt-oss"]
    description: "OpenAI's open-weight GPT models."

default_model: "moonshotai/kimi-k2-instruct-0905"

usage_notes:
  - "Groq models are served via an OpenAI-compatible API."
  - "All models support the 'temperature' parameter."
  - "Pricing is per million tokens (input/output)."
  - "No current support for vision or image generation via this integration."
  - "Context windows: Llama/GPT-OSS models support 131K tokens, Kimi supports 256K tokens."
