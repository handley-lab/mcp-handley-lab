models:
  llama-3.1-8b-instant:
    description: "Meta's Llama 3.1 8B model optimized for speed with 131K context window."
    capabilities: "⚡ Best for: Fast inference, general chat, summarization, cost-effective tasks."
    tags: ["llama", "fast", "cost-effective"]
    context_window: "131,072 tokens"
    output_tokens: 131072
    param: "max_tokens"
    supports_temperature: true
    supports_vision: false
    supports_tool_calling: true
    supports_system_prompt: true
    input_per_1m: 0.05
    output_per_1m: 0.08

  llama-3.3-70b-versatile:
    description: "Meta's Llama 3.3 70B versatile model with 131K context window, delivering quality comparable to larger models."
